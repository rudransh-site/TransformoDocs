{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<div class="row"><div class="col-md-6">
<h4 class="mb-3">Create account</h4>
<div class="card"><div class="card-body">
  <form method="post" novalidate>{% csrf_token %}
    {% for f in form %}<div class="mb-3"><label class="form-label">{{ f.label }}</label>{{ f }}{% for e in f.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>{% endfor %}
    <button class="btn btn-primary">Create</button> <a class="btn btn-link" href="{% url 'manage_users' %}">Cancel</a>
  </form>
</div></div></div></div>
{% endblock %}
